    <!-- CONTEÚDO PRINCIPAL -->
    <main class="pt-5 mt-5">
        <section class="section-padding">
            <div class="container">
                <div class="section-title">
                    <span>FALE CONOSCO</span>
                    <h2>Entre em <span class="rainbow-text">Contato</span></h2>
                    <p>Fique à vontade para mandar uma mensagem ou trocar uma ideia sobre projetos e tecnologia!</p>
                </div>

                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="info-card p-4">
                            <form action="#" method="POST">
                                <div class="mb-3">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nome" placeholder="Seu nome completo" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">E-mail</label>
                                    <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="mensagem" class="form-label">Mensagem</label>
                                    <textarea class="form-control" id="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
                                </div>
                                <button type="submit" class="btn btn-rainbow w-100">
                                    <i class="bi bi-send me-1"></i> Enviar Mensagem
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
