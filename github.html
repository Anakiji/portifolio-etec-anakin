<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando para o GitHub...</title>
    <!-- Redireciona automaticamente em 0 segundos para o seu perfil -->
    <meta http-equiv="refresh" content="0; url=https://github.com/Anakiji">
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            border: 4px solid #30363d;
            border-top: 4px solid #f778ba;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #f778ba;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Redirecionando para o GitHub de Anakin...</h2>
    <p>Se não for redirecionado automaticamente, <a href="https://github.com/Anakiji">clique aqui</a>.</p>
</body>
</html>
